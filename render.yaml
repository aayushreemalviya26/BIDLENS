services:
  - type: web
    runtime: python
    name: bidlens-api
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements-cloud.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bidlens-postgres
          property: connectionString
      - key: UPLOAD_DIR
        value: /tmp/bidlens-uploads
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: PROTOTYPE_ADMIN_USERNAME
        value: admin
      - key: PROTOTYPE_ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: BIDLENS_RETRIEVAL
        value: lexical
      - key: SEED_JUDGE_DEMO
        value: "true"
      - key: PUBLIC_JUDGE_DEMO
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.11

databases:
  - name: bidlens-postgres
    region: singapore
    plan: free
    databaseName: bidlens
    user: bidlens
    postgresMajorVersion: "18"
